<text x="30.8" y="279.5" fill="#d0d4dc" xml:space="preserve">Everything past the front page. The</text>
<text x="333.2" y="279.5" fill="#00afff" text-decoration="underline" xml:space="preserve">root README</text>
<text x="434.0" y="279.5" fill="#d0d4dc" xml:space="preserve">covers installing and using</text>
<text x="669.2" y="279.5" fill="#ffaf87" xml:space="preserve">tread</text>
<text x="711.2" y="279.5" fill="#d0d4dc" xml:space="preserve">; this</text>
<text x="30.8" y="297.5" fill="#d0d4dc" xml:space="preserve">covers how it is built and how it is proven.</text>
<text x="30.8" y="333.5" fill="#d0d4dc" xml:space="preserve">This folder is itself a corpus —</text>
<text x="308.0" y="333.5" fill="#ffaf87" xml:space="preserve">tread --index docs</text>
<text x="467.6" y="333.5" fill="#d0d4dc" xml:space="preserve">walks it,</text>
<text x="551.6" y="333.5" fill="#ffaf87" xml:space="preserve">i</text>
<text x="568.4" y="333.5" fill="#d0d4dc" xml:space="preserve">lists these pages grouped</text>
<text x="30.8" y="351.5" fill="#d0d4dc" xml:space="preserve">by the section they appear under, and</text>
<text x="350.0" y="351.5" fill="#ffaf87" xml:space="preserve">]</text>
<text x="366.8" y="351.5" fill="#d0d4dc" xml:space="preserve">/</text>
<text x="383.6" y="351.5" fill="#ffaf87" xml:space="preserve">[</text>
<text x="400.4" y="351.5" fill="#d0d4dc" xml:space="preserve">step between them. The two links under</text>
<text x="30.8" y="369.5" fill="#d0d4dc" xml:space="preserve">"Elsewhere" climb above that root, so</text>
<text x="350.0" y="369.5" fill="#ffaf87" xml:space="preserve">tread</text>
<text x="400.4" y="369.5" fill="#d0d4dc" xml:space="preserve">refuses to follow them from here; run</text>
<text x="719.6" y="369.5" fill="#ffaf87" xml:space="preserve">tread</text>
<text x="30.8" y="387.5" fill="#ffaf87" xml:space="preserve">--index .</text>
<text x="114.8" y="387.5" fill="#d0d4dc" xml:space="preserve">from the repository root to walk the whole project instead.</text>
