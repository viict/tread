# tread build configuration.
#
# The release artifact is a fully static musl binary. No external linker or
# C toolchain is required: rustc's self-contained musl libc + lld do the work.
#   rustup target add x86_64-unknown-linux-musl
#   cargo musl

[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-self-contained=yes",
]

[alias]
musl = "build --release --target x86_64-unknown-linux-musl"
musl-test = "test --target x86_64-unknown-linux-musl"

# aarch64 musl is cross-built on x86_64 CI runners. The system `ld` cannot
# link AArch64 objects, so use rustc's bundled lld and self-contained libc
# rather than requiring a cross toolchain on the runner.
[target.aarch64-unknown-linux-musl]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-self-contained=yes",
    "-C", "linker=rust-lld",
]
