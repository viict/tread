[package]
name = "tread"
version = "0.4.2"
edition = "2021"
rust-version = "1.75"
description = "A terminal reader for markdown, CSV, JSON and source code. Zero dependencies."
repository = "https://github.com/viict/tread"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["pager", "markdown", "csv", "json", "code"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["trajectory.json", "tools/__pycache__", ".claude", "CLAUDE.md", ".github"]

[[bin]]
name = "tread"
path = "src/main.rs"

# Hard constraint: this table stays empty. See SPEC.md §Dependencies.
[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
